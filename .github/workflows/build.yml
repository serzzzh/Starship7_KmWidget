name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Privileged Release APK
      run: ./gradlew assemblePrivilegedRelease

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: kmwidget-apk
        path: app/build/outputs/apk/privileged/release/*.apk
